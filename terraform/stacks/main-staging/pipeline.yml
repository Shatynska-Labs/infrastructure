---
# This stack's pipeline configuration, read by .github/workflows/'s
# discovery step -- see "Each Stack Declares Its Own Pipeline
# Configuration" (openspec/specs/iac-cicd-pipeline/spec.md).
#
# This file is what made adding staging a matter of adding a directory: no
# file under .github/workflows/ changed to bring this stack into the
# validation, plan, apply and drift workflows.

# The GitHub Environment this stack's apply job attaches to. REQUIRED.
#
# `main-staging` requires NO reviewer, which is the point of it: an approved
# staging deploy is as slow as prod and stops being used. That is a property
# of the Environment's protection rules -- repository settings, which no file
# here can verify -- and not of the workflow.
#
# The apply job still declares this Environment, so the write token stays
# confined to that job. Only the reviewer is dropped; the confinement is
# independent of it. What bounds an unreviewed apply is that staging's Read &
# Write token belongs to a Hetzner project holding staging alone.
#
# THIS STACK'S NAME, and no longer the environment's. `docs/naming-conventions.md`
# calls for the stack here, and it took a re-creation to deliver: GitHub offers
# no way to rename a deployment Environment -- no UI control, and the REST API
# exposes only GET, PUT and DELETE with the name in the URL path (measured
# 2026-09-12). So the Environment this names was created fresh and its secrets
# re-entered by hand, which is why `target_environment` below and this field
# NO LONGER SPELL THE SAME WORD. That divergence is the scheme working: a
# second tenant's staging would collide on `staging` and cannot collide here.
github_environment: main-staging

# The repository secret holding this stack's read-only Hetzner token.
# REQUIRED.
#
# Not `HCLOUD_TOKEN`: a repository secret of that name is shadowed by the Read
# & Write token every GitHub Environment defines, a repository secret holds one
# value, and two stacks planning under one token is the defect this field
# exists to prevent. Discovery fails the pipeline naming both offenders if two
# stacks ever declare the same name.
#
# `MAIN_STAGING` rather than `STAGING`, for the reason production's declaration
# gives at length: repository secrets are one flat namespace, and the
# environment alone stops being unique at a second tenant.
read_only_secret: HCLOUD_TOKEN_MAIN_STAGING

# The Ansible group this stack's converge targets. REQUIRED. Read the
# production stack's declaration for why this is declared rather than derived
# from the stack's name, and for why it alone among the required fields carries
# no uniqueness obligation.
#
# `staging` was already the environment axis spelled in full -- only `prod` was
# abbreviated -- so this stack's group name has never moved, while its
# directory, its GitHub Environment and its read-only secret all have.
# `group_vars/staging.yml` stayed where it was throughout. That is the clearest
# demonstration in the repository that the two names are independent: every
# other name this stack has is now `main-staging`, and this one is not.
target_environment: staging

# Whether the Destroy Policy Gate applies to this stack. OPTIONAL;
# absent means it applies, so a mistake in this file fails safe.
#
# `false` here, and stated rather than omitted. Staging is rebuilt on purpose
# -- rehearsing a destructive change is what it is for -- and requiring an
# override label on every destructive plan against a disposable stack
# trains the operator to apply the label, which is the same failure mode as
# an approval prompt with nothing to approve.
#
# POLARITY IS LOAD-BEARING AND LIVES IN THE NAME: this field names the GATE,
# so `false` means the gate does NOT apply. `disposable: true` would be the
# same value with the opposite spelling, and nothing in a value can tell a
# reader which was meant. Prod may not set this false; staging may.
destroy_policy_gate: false

# Whether the shared platform stack is deployed to this stack's host.
# OPTIONAL; absent means it is NOT. Read the production stack's declaration
# for the polarity rule, for why the optional fields' defaults differ, and for
# why this field sits in a file beside a `terraform.tfvars`.
#
# THIS IS THE FIELD `deploy-the-platform-stack-per-environment` FLIPPED, and
# the interval it closes is the reason the opt-in is declared rather than
# derived. This host has authorised the `platform` deploy key since
# 2026-09-10 -- `configure-the-staging-host` committed its public half and
# converged the host the same evening -- and received no deploy in the three
# days after, because it had no `PLATFORM_*` secrets, no ACME mailbox, no
# dead-man's-switch check and no Slack target. "This host accepts the platform
# deploy key" and "the platform pipeline deploys to this stack" were true at
# different times. Deriving this from `deploy_apps` would have made them one
# fact and would have had staging deploying from the moment its key was
# committed, which is the state `add-a-staging-environment` deliberately
# avoided in the analogous case of opening ports in front of a host with
# nothing behind them.
#
# `false` SINCE let-a-stack-opt-out-of-the-converge, because this stack has no
# server: `server_enabled = false` in this directory's terraform.tfvars, applied
# on 2026-09-19 (`fix: disable the staging server`). A deploy row would aim at
# a tailnet peer that no longer exists. `host_vars/main-staging.yml` keeps
# authorising the `platform` key, which is the "authorised but not deployed to"
# state described above and is permitted: the obligation to authorise runs
# from `true` only.
#
# RE-ENABLING STAGING flips this and `converges_host` below back to `true` in
# the same pull request that sets `server_enabled = true`. While it is `true`,
# this stack's Environment requires no reviewer, so the deploy proceeds on
# merge with no approval prompt -- see `github_environment` above.
deploys_platform: false

# Whether the host-configuration workflow converges this stack's host.
# OPTIONAL; absent means it IS. Read the production stack's declaration for the
# polarity rule, why its default differs from `deploys_platform`'s, and why it
# is declared rather than derived from `server_enabled`.
#
# `false` because the server was decommissioned on 2026-09-19 (see
# `deploys_platform` above): its converge row failed at inventory resolution on
# every merge touching `ansible/`, naming a group with no host. The converge
# now names this stack as excluded and runs no row for it. Plan, apply and
# drift still cover it -- they are what hold the decommissioned state in place.
converges_host: false
