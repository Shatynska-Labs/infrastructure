---
# FIXTURE ONLY, for the `without-application-subdirs` scenario -- a copy of `default/prepare.yml`'s
# fixture, at offset 8 of the sixteen loop minors this working tree claims
# (offsets 0 to 6 are taken by this role's other scenarios; see
# ansible/scripts/run-molecule's loop_base_for()) and with a backing file of
# its own. Nothing here is the subject of any assertion. Written by the
# record-basis-api-durable-store test-authoring pass; see that change's
# test-plan.md. `default/prepare.yml` carries the full account of why the
# minor is derived, why the attribution guard precedes the release, and why
# the device is left unformatted -- all of which hold here unchanged.
- name: Prepare
  hosts: all
  become: true
  vars:
    # This scenario takes offset 8 of the sixteen minors this working tree claims.
    # See ansible/scripts/run-molecule's loop_base_for() for the band, the
    # offsets and why the value is derived rather than fixed.
    platform_data_volume_fixture_loop_base: "{{ lookup('env', 'INFRA_WORKTREE_LOOP_BASE') }}"
    platform_data_volume_fixture_loop_minor: "{{ platform_data_volume_fixture_loop_base | int + 8 }}"
    platform_data_volume_device: /dev/loop{{ platform_data_volume_fixture_loop_minor }}
    platform_data_volume_backing_file: /root/platform-data-volume-without-app-subdirs-backing.img
  tasks:
    # FIRST, before anything has touched the host. An unset base is not a
    # cosmetic failure: `| int` turns anything it does not understand into 0,
    # and /dev/loop0 is a real device on a developer workstation -- Docker
    # Desktop's ISO cache on the one this was written on. A converge reaching
    # it would format it. There is no spelling of a refusing DEFAULT that both
    # survives the arithmetic and cannot name a device, which is why this is a
    # task rather than the refusing default molecule.yml uses for the instance
    # name.
    - name: Refuse to run without this working tree's loop-minor base
      ansible.builtin.assert:
        that:
          - platform_data_volume_fixture_loop_base is match('^[0-9]+$')
          - platform_data_volume_fixture_loop_base | int >= 1024
        fail_msg: >-
          INFRA_WORKTREE_LOOP_BASE is unset or is not a loop-minor base
          (read as '{{ platform_data_volume_fixture_loop_base }}'). Run the
          suite through ansible/scripts/run-molecule, which derives it from
          this working tree's own path -- see AGENTS.md, "Namespacing Molecule
          per working tree".

    - name: Refresh the apt cache and install fixture-only loop/filesystem tooling
      ansible.builtin.apt:
        name:
          - util-linux
          - e2fsprogs
        state: present
        update_cache: true
        cache_valid_time: 0

    - name: Create a sparse backing file to stand in for the attached Hetzner Volume
      ansible.builtin.command: truncate -s 512M {{ platform_data_volume_backing_file }}
      args:
        creates: "{{ platform_data_volume_backing_file }}"

    - name: Check whether this working tree's loop device node already exists
      ansible.builtin.stat:
        path: "{{ platform_data_volume_device }}"
      register: platform_data_volume_loop_node

    - name: Create the loop device node (major 7 = loop) if it does not already exist
      ansible.builtin.command: >-
        mknod -m 0660 {{ platform_data_volume_device }} b 7
        {{ platform_data_volume_fixture_loop_minor }}
      when: not platform_data_volume_loop_node.stat.exists
      changed_when: true

    # READ, REFUSE, RELEASE, then associate -- in that order, and the order is
    # the whole point.
    #
    # Releasing unconditionally is what stops this run inheriting the last
    # one's device. But a derived minor is a number nothing outside this
    # repository has agreed to leave alone, and `losetup -d` inside a
    # privileged container detaches the HOST's device, whatever the host was
    # using it for. So the association is read first and the minor is released
    # only where its backing file is one this fixture family creates; anything
    # else fails the play naming what holds it.
    #
    # That prefix establishes that the holder is *a* run of these fixtures, not
    # that it is *this tree's* run -- the path the kernel records is the path
    # inside a container that is long gone. It is the strongest attribution
    # available, and it buys the whole of the damage case.
    - name: Read what this working tree's loop device is currently associated with
      ansible.builtin.command: losetup --noheadings --output BACK-FILE {{ platform_data_volume_device }}
      register: platform_data_volume_loop_holder
      changed_when: false
      failed_when: false

    # THREE STATES, measured inside the pinned image rather than guessed,
    # because the first reads as the third if you guess: a minor whose node
    # exists but holds nothing returns **rc 0 with EMPTY stdout**, not a
    # non-zero rc. A guard checking only the return code refuses every free
    # minor and renders its message as "held by ''" -- a premise check firing
    # on the correct state and reporting the opposite of the truth.
    #
    #   node exists, unassociated  -> rc 0, stdout ''
    #   associated                 -> rc 0, stdout the backing file's path
    #   no node at all             -> rc 1, stderr 'No such device'
    #
    # The third cannot arise here -- the node is created immediately above --
    # so THE GUARD FAILS CLOSED ON ANY NON-ZERO rc rather than reading it as
    # "free". `failed_when: false` on the read collapses every failure into a
    # non-zero rc: a `losetup` without `--output` (busybox's has neither flag),
    # an unreadable sysfs, the binary absent. Treating those as free would
    # release whatever the host holds at this minor, which is the one outcome
    # this guard exists to prevent. Not knowing is a refusal, not a permission.
    - name: Refuse a loop minor this fixture family cannot attribute to itself
      ansible.builtin.assert:
        that:
          - platform_data_volume_loop_holder.rc == 0
          - platform_data_volume_loop_holder.stdout | trim | length == 0 or
            platform_data_volume_loop_holder.stdout | trim is match('^/root/platform-data-volume-')
        fail_msg: >-
          Refusing to release {{ platform_data_volume_device }}. The read
          returned rc {{ platform_data_volume_loop_holder.rc }} and
          '{{ platform_data_volume_loop_holder.stdout | trim }}'. Either it is
          held by something no fixture of this role creates, or the read itself
          failed and what holds it is unknown; releasing it could break whatever
          the host is using it for, so this play refuses rather than reclaiming
          it.

    - name: Release the loop device from whatever a previous run left on it
      ansible.builtin.command: losetup -d {{ platform_data_volume_device }}
      register: platform_data_volume_loop_detach
      changed_when: platform_data_volume_loop_detach.rc == 0
      # rc 1 is the ordinary "not currently associated" case. This task has to
      # guarantee the minor is free afterwards, not that it was busy before.
      failed_when: false

    - name: Associate this run's own backing file with the loop device
      ansible.builtin.command: >-
        losetup {{ platform_data_volume_device }} {{ platform_data_volume_backing_file }}
      changed_when: true

    # The role itself is responsible for formatting an unformatted device
    # (tasks.md 1.1: "formats (if needed)", and the delta spec's requirement
    # text does not restrict that to a pre-formatted device) -- so this
    # fixture deliberately leaves the device UNFORMATTED. Formatting it here
    # would test the role against a case production never actually presents
    # on first attach (an already-formatted volume) and would silently mask
    # a role that cannot format a raw device at all.
    # `rc != 2`, NOT `rc == 0`, and for the same reason the attribution guard
    # above fails closed. Reading "anything non-zero" as clean accepts a blkid
    # that did not probe at all, which reports this premise satisfied having
    # established nothing. Measured in the pinned image: an unformatted device
    # gives 2, a formatted one 0, a usage error 1. Only 2 means "looked, found
    # nothing", so only 2 passes.
    #
    # rc 2 also covers an ABSENT device. What rules that out here is not this
    # task but the two above it: the node is created, and the association is
    # unconditional and carries no `failed_when`, so a device that is not there
    # fails the play before this runs.
    - name: Assert the fixture's device starts with no filesystem on it
      ansible.builtin.command: blkid {{ platform_data_volume_device }}
      register: platform_data_volume_loop_blkid
      changed_when: false
      failed_when: platform_data_volume_loop_blkid.rc != 2
      # The premise every assertion in this scenario rests on, checked rather
      # than assumed. The way it fails -- an inherited association carrying a
      # previous converge's filesystem -- is invisible from inside the
      # container and makes the role's format task a silent no-op, so the
      # scenario would pass having exercised nothing.
