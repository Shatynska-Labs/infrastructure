---
# Molecule scenario `without-application-subdirs` for the `platform_data_volume` role, written by the
# record-basis-api-durable-store test-authoring pass BEFORE that change's
# implementation existed. It verifies the scenario of iac-host-configuration's
# *Platform Data Volume Is Mounted at a Fixed Host Path*
# (openspec/specs/iac-host-configuration/spec.md) named in converge.yml. The
# platform stanza is `default/molecule.yml`'s, with this scenario's own
# namespaced instance name and short hostname; that file carries the rationale.
dependency:
  name: galaxy
  options:
    # ansible.posix (pinned 1.6.2 in requirements.yml already, for
    # deploy_user's authorized_key key_options) is the natural module family
    # for a mount role (ansible.posix.mount manages both the live mount and
    # its /etc/fstab entry in one task) -- no NEW pin is expected for this
    # role, but the dependency step still runs so whatever the role actually
    # ends up needing from the pinned set is present before converge.
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  # Instance name namespaced per working tree, with a default Docker refuses,
  # and an explicit `hostname` because the driver would otherwise derive one
  # from the name and cross the 64-byte limit. See
  # ansible/roles/docker/molecule/default/molecule.yml for the full account --
  # every scenario must agree on the variable.
  - name: platform-data-volume-without-app-subdirs-instance-${INFRA_WORKTREE_NS:-unset:run-via-ansible/scripts/run-molecule}
    hostname: platform-data-volume-without-app-subdirs
    # Digest-pinned. See ansible/roles/docker/molecule/default/molecule.yml for
    # why a digest and not a version tag, and for how to refresh it -- every
    # scenario must carry the same one.
    image: geerlingguy/docker-ubuntu2204-ansible@sha256:0172e3b586fc316491b5ac080e6b24c5f66cde985c27c625025f13f66a8cd21f
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock

provisioner:
  name: ansible
  env:
    # See ansible/roles/docker/molecule/default/molecule.yml for why this is
    # needed -- same reasoning, applies to every role's scenario.
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../

verifier:
  name: ansible
